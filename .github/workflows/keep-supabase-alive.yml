name: Keep Supabase Alive

on:
  schedule:
    # Runs at 00:00 UTC every 2 days.
    # This guarantees active traffic well within Supabase's 7-day inactivity pause limit.
    - cron: '0 0 */2 * *'
  
  # Allows manual triggering from the GitHub Actions tab
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Supabase Database & REST API
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd backend
          npm ci || npm install

      - name: 1. Direct PostgreSQL DB Connection Ping
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL secret is missing in GitHub Repository Secrets."
            echo "To enable direct PostgreSQL pings, add DATABASE_URL in Settings -> Secrets and variables -> Actions."
          else
            echo "Executing direct PostgreSQL Keep-Alive query..."
            cd backend
            node keepalive.js
          fi

      - name: 2. Supabase REST API Gateway Ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL or SUPABASE_ANON_KEY secret is not set."
            echo "If DATABASE_URL succeeded above, your database was pinged. However, setting SUPABASE_URL and SUPABASE_ANON_KEY ensures REST API gateway activity as well."
          else
            CLEAN_URL="${SUPABASE_URL%/}"
            echo "Pinging Supabase REST API at: $CLEAN_URL/rest/v1/"

            # Ping REST API root
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 15 -X GET "$CLEAN_URL/rest/v1/" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" || echo "CURL_ERROR")

            echo "Supabase REST API responded with HTTP status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "✅ REST API ping successful!"
            else
              echo "::error::REST API ping returned HTTP $HTTP_STATUS."
              if [ "$HTTP_STATUS" = "CURL_ERROR" ]; then
                echo "Network failure or Supabase project host is unreachable (Project may be paused already!)."
              fi
              # Exit with error if both REST ping and DB ping couldn't run
              if [ -z "$DATABASE_URL" ]; then
                exit 1
              fi
            fi
          fi

      - name: Final Check
        run: |
          echo "🎉 Keep-Alive execution completed!"
