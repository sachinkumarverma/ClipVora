name: Keep Supabase Alive

on:
  schedule:
    # Runs at 00:00 UTC every 2 days.
    # This guarantees active traffic well within Supabase's 7-day inactivity pause limit.
    - cron: '0 0 */2 * *'
  
  # Allows manual triggering from the GitHub Actions tab
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Supabase Database & REST API
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          cd backend
          npm ci || npm install

      - name: Keep-Alive Execution
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          SUCCESS=0

          # 1. Direct PostgreSQL DB Connection Ping (Primary & Most Reliable)
          if [ -n "$DATABASE_URL" ]; then
            echo "--- Running Direct PostgreSQL Keep-Alive ---"
            cd backend
            if node keepalive.js; then
              echo "✅ PostgreSQL Direct Database Ping SUCCESSFUL!"
              SUCCESS=1
            else
              echo "❌ Direct PostgreSQL Ping Failed."
            fi
            cd ..
          else
            echo "DATABASE_URL secret is missing in GitHub Repository Secrets."
          fi

          # 2. Supabase REST API Gateway Ping (Optional Secondary)
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "--- Running Supabase REST API Ping ---"
            CLEAN_URL="${SUPABASE_URL%/}"
            
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 15 -X GET "$CLEAN_URL/rest/v1/" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" || echo "CURL_ERROR")

            echo "Supabase REST API responded with HTTP status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "✅ REST API Ping SUCCESSFUL!"
              SUCCESS=1
            else
              echo "Info: REST API ping returned HTTP $HTTP_STATUS (PostgreSQL DB ping already handled project activity)."
            fi
          fi

          # Final Evaluation
          if [ "$SUCCESS" -eq 1 ]; then
            echo "🎉 Keep-Alive succeeded! Supabase database activity registered."
            exit 0
          else
            echo "::error::Both PostgreSQL DB ping and REST API ping failed or were missing secrets."
            echo "PLEASE ACTION: Add 'DATABASE_URL' to your GitHub Repository Secrets:"
            echo "1. Go to your GitHub Repo -> Settings -> Secrets and variables -> Actions"
            echo "2. Click 'New repository secret'"
            echo "3. Name: DATABASE_URL"
            echo "4. Value: postgresql://postgres.nbioyoitrcvhunytdbds:Skverma%402001@aws-1-ap-northeast-1.pooler.supabase.com:6543/postgres"
            exit 1
          fi
