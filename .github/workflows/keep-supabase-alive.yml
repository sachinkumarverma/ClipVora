name: Keep Supabase Alive

on:
  schedule:
    # Runs at 00:00 every 3 days. 
    # This ensures your project gets activity well within the 7-day inactivity limit.
    - cron: '0 0 */3 * *'
  
  # Allows you to trigger the workflow manually from the GitHub Actions tab for testing
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Supabase REST API
        env:
          # You will need to add these two secrets in your GitHub repository:
          # Go to Settings -> Secrets and variables -> Actions -> New repository secret
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Trim trailing slash if present
          CLEAN_URL="${SUPABASE_URL%/}"

          echo "Attempting to ping Supabase at: $CLEAN_URL"

          # We query an actual database table (analytics_events) with select=id&limit=1.
          # This forces PostgREST to execute a SELECT query against PostgreSQL, registering real DB activity.
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 15 -X GET "$CLEAN_URL/rest/v1/analytics_events?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" || echo "CURL_ERROR")
            
          if [ "$HTTP_STATUS" = "CURL_ERROR" ]; then
            echo "::error::Network or DNS error occurred when trying to reach Supabase."
            echo "Possible reasons:"
            echo " 1. Your Supabase project is ALREADY PAUSED by Supabase (which disables its DNS host)."
            echo " 2. SUPABASE_URL secret is incorrect or missing 'https://'."
            echo "Please check your Supabase Dashboard to restore/unpause the project."
            exit 1
          fi

          echo "Supabase responded with HTTP status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Successfully pinged Supabase!"
          else
            echo "Warning: Received HTTP status $HTTP_STATUS."
            if [ "$HTTP_STATUS" -eq 503 ] || [ "$HTTP_STATUS" -eq 404 ]; then
              echo "HTTP $HTTP_STATUS usually indicates the Supabase project is currently paused or undergoing maintenance."
            fi
          fi
